apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-receive-data-pvc
  namespace: openshift-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: thin-csi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: thanos-receive
spec:
  replicas: 1
  serviceName: thanos-receive
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-receive
    spec:
      containers:
      - name: thanos-receive
        image: quay.io/thanos/thanos:v0.37.2
        args:
        - receive
        - --tsdb.path=/var/thanos/receive
        - --objstore.config-file=/etc/thanos/thanos.yaml
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:10902
        - --remote-write.address=0.0.0.0:19291
        - --label=receive_replica="thanos-receive-0"
        - --tsdb.retention=24h
        ports:
        - name: grpc
          containerPort: 10901
        - name: http
          containerPort: 10902
        - name: remote-write
          containerPort: 19291
        volumeMounts:
        - name: data
          mountPath: /var/thanos/receive
        - name: config
          mountPath: /etc/thanos
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: thanos-receive-data-pvc
      - name: config
        secret:
          secretName: thanos-objectstorage
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: thanos-receive
spec:
  ports:
  - name: grpc
    port: 10901
    targetPort: 10901
  - name: http
    port: 10902
    targetPort: 10902
  - name: remote-write
    port: 19291
    targetPort: 19291
  selector:
    app.kubernetes.io/name: thanos-receive
