apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-compactor-pvc
  namespace: openshift-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: thin-csi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-compactor
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: thanos-compactor
spec:
  replicas: 1
  serviceName: thanos-compactor
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos-compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos-compactor
    spec:
      containers:
      - name: compactor
        image: quay.io/thanos/thanos:v0.37.2
        args:
        - compact
        - --data-dir=/data
        - --objstore.config-file=/etc/thanos/thanos.yaml
        - --retention.resolution-raw=6d
        - --retention.resolution-5m=17d
        - --retention.resolution-1h=90d
        - --delete-delay=1h
        - --compact.concurrency=1
        - --wait
        ports:
        - name: http
          containerPort: 10902
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/thanos
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: thanos-compactor-pvc
      - name: config
        secret:
          secretName: thanos-objectstorage
